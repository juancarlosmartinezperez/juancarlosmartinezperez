# Databricks Asset Bundle: despliega el notebook y un job semanal.
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run filmaffinity_ingest
bundle:
  name: filmaffinity

variables:
  user_id:
    description: ID de usuario de FilmAffinity
    default: "5089737"
  catalog:
    description: Catálogo de Unity Catalog destino
    default: main
  schema:
    description: Esquema destino
    default: filmaffinity

resources:
  jobs:
    filmaffinity_ingest:
      name: filmaffinity_ingest
      schedule:
        # Lunes a las 07:00 (hora de Madrid). Sintaxis Quartz.
        quartz_cron_expression: "0 0 7 ? * MON"
        timezone_id: Europe/Madrid
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest
          # Sin cluster definido el job usa cómputo serverless.
          # Si tu workspace no tiene serverless, añade aquí un job_cluster_key / new_cluster.
          notebook_task:
            notebook_path: ./src/ingest_filmaffinity.py
            base_parameters:
              user_id: ${var.user_id}
              catalog: ${var.catalog}
              schema: ${var.schema}
              lang: es
          max_retries: 1
          min_retry_interval_millis: 900000

targets:
  # Sin "mode: development" a propósito: ese modo pausa los schedules.
  default:
    default: true
    workspace:
      host: https://<tu-workspace>.cloud.databricks.com
